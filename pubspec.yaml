name: expense_iq
description: A premium offline-first personal finance Android app built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.0
  firebase_messaging: ^15.2.0
  google_sign_in: ^6.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  get_it: ^8.0.3
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  google_mlkit_text_recognition: ^0.14.0
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  logger: ^2.5.0
  connectivity_plus: ^6.1.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.1
  local_auth: ^2.3.0
  intl: ^0.20.1
  pdf: ^3.11.1
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
